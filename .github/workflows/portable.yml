name: Dagami Agent Proxy (manual builds only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04-arm, macos-15-intel, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add wasm32-unknown-unknown
      - run: go run ./cmd/dagami-build audit
      - name: Build and test portable client
        if: runner.os != 'Windows'
        run: go run ./cmd/dagami-build -test -source
      - name: Build and test Windows variants
        if: runner.os == 'Windows'
        run: go run ./cmd/dagami-build -test -source -windows-native -native-checks
      - uses: actions/upload-artifact@v4
        with:
          name: dagami-agent-proxy-${{ matrix.os }}
          path: |
            dist-portable/native-next/*.zip
            dist-portable/native-next/windows-native/DagamiAgentProxy.exe
            dist-portable/native-next/SHA256SUMS.json
          if-no-files-found: error
