name: Source hygiene
on: [push, pull_request]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/check_source_hygiene.py
  dns:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: DNS transaction checks with fixtures only
        shell: powershell
        run: ./tests/native/SystemDnsChecks.ps1
