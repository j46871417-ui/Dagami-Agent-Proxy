name: Linux portable artifacts (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb libsecret-tools desktop-file-utils
      - run: python -m pip install '.[build,desktop]'
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: xvfb-run -a python build_portable.py
      - uses: actions/upload-artifact@v4
        with:
          name: dagami-agent-proxy-linux
          path: |
            dist-portable/dagami-agent-proxy-*.zip
            dist-portable/SHA256-*.json
