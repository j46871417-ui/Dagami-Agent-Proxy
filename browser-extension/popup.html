<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Прокси Dagami</title>
  <style>
    :root { color-scheme: light dark; }
    body { font: 14px/1.5 system-ui, sans-serif; width: 288px; margin: 16px; }
    h1 { font-size: 18px; margin: 0 0 12px; }
    .toggle { display: flex; align-items: center; gap: 10px; font-weight: 600; }
    #toggle { width: 18px; height: 18px; margin: 0; accent-color: #6856cf; }
    p, details { margin: 12px 0 0; }
    summary { cursor: pointer; }
    input[type=number] { width: 6em; margin-top: 8px; }
    :focus-visible { outline: 2px solid currentColor; outline-offset: 3px; }
  </style>
</head>
<body>
  <h1>Прокси Dagami</h1>
  <label class="toggle">
    <input id="toggle" type="checkbox" role="switch" aria-describedby="status fallback" disabled>
    Использовать прокси Dagami
  </label>
  <p id="status" role="status">Читаем настройки браузера…</p>
  <p id="fallback">При недоступности локального моста браузер может подключиться к сайтам напрямую.</p>
  <details>
    <summary>Параметры моста</summary>
    <label>Локальный порт <input id="port" type="number" min="1" max="65535" required disabled></label>
  </details>
  <script src="config.js"></script>
  <script src="route.js"></script>
  <script src="popup.js"></script>
</body>
</html>
