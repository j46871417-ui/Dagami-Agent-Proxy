<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<title>Dagami Selective Proxy</title>
<style>
body { font: 14px system-ui; min-width: 300px; margin: 16px; }
label, p { display: block; margin: 12px 0; }
input { width: 6em; }
</style>
<h1>Прокси Dagami</h1>
<p>Подключитесь по ключу в Dagami Agent Proxy и оставьте приложение открытым.</p>
<label>Порт локального моста <input id="port" type="number" min="1" max="65535" value="53200" required></label>
<button id="enable">Включить</button>
<button id="disable">Выключить</button>
<p id="status" role="status" aria-live="polite"></p>
<script src="popup.js"></script>
</html>
