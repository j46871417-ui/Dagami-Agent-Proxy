[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dagami-agent-proxy"
version = "0.4.0b0"
description = "Dagami Agent Proxy: application proxy sessions and reversible launchers"
requires-python = ">=3.10"
readme = "PORTABLE.md"
license = {text = "MIT"}

[project.optional-dependencies]
build = ["pyinstaller>=6.16,<7"]
desktop = ["pystray>=0.19.5,<1", "Pillow>=10,<13"]

[project.scripts]
dagami-agent-proxy = "devproxy_pkg.entry:main"

[tool.setuptools.packages.find]
include = ["devproxy_pkg*"]

[tool.setuptools.package-data]
devproxy_pkg = ["assets/*.png", "assets/*.svg", "assets/*.ico", "assets/*.icns", "assets/*.json"]
