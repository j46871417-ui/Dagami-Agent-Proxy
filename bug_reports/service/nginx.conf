# Include ONLY in the HTTPS server block for dns.dagami.ru.
# The backend is loopback-only. Do not expose 3091 in the firewall.
location ^~ /api/bug-reports/v1/ {
    client_max_body_size 3m;
    client_body_timeout 15s;
    proxy_connect_timeout 3s;
    proxy_read_timeout 35s;
    proxy_send_timeout 20s;
    proxy_pass http://127.0.0.1:3091;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";
    proxy_http_version 1.1;
    proxy_hide_header Server;
    access_log off;
}
location ^~ /support/agent-proxy/ {
    try_files $uri $uri/ =404;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
}
