# Install in nginx conf.d. This port must remain loopback-only.
server {
    listen 127.0.0.1:3093;
    server_name localhost 127.0.0.1;
    root /var/www/html;
    index index.html;
    allow 127.0.0.1;
    deny all;
    access_log off;
    client_max_body_size 3m;
    location = / { return 302 /support/agent-proxy/admin/; }
    location ^~ /api/bug-reports/v1/ {
        proxy_pass http://127.0.0.1:3091;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Dagami-Admin-Channel ssh-loopback;
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 35s;
    }
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control no-store always;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
    }
}
